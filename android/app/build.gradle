apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

/**
 * React Native configuration: this block can be customized as needed.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true if you want Proguard (or R8) to shrink your release build.
 */
def enableProguardInReleaseBuilds = false

/**
 * Specify the preferred JSC flavor.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Define hermesEnabled. You can override via gradle properties if needed.
def hermesEnabled = project.hasProperty("hermesEnabled") ? project.getProperty("hermesEnabled") : "false"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.invitedonly"
    defaultConfig {
        applicationId "com.invitedonly"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.2.2"
    }
    signingConfigs {
        debug {
            storeFile file(System.env.HOME + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
       release {
           // Specify your release keystore file and credentials.
           storeFile file(System.env.HOME + "/io-invitedonly-release.keystore")
           storePassword "123456"
           keyAlias "io-invitedonly"
           keyPassword "123456"
       }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField("String", "BUILD_TIME", "\"0\"")
        }
        release {
           signingConfig signingConfigs.release
            // Use the provided flag for minification (set true/false Evia enableProguardInReleaseBuilds)
            minifyEnabled enableProguardInReleaseBuilds
            // Define ProGuard/R8 rules for release builds.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField("String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\"")
        }
    }
}

dependencies {
    // The version of react-native is managed by the React Native Gradle Plugin.
    implementation("com.facebook.react:react-android")

    // Firebase dependencies via BOM.
    implementation(platform("com.google.firebase:firebase-bom:33.12.0"))
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")

    // Facebook Android SDK - consider specifying a concrete version if "latest.release" causes issues.
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'

    // Select Hermes (if enabled) or JSC as JavaScript engine.
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}