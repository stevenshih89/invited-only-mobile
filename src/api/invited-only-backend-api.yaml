        guestId:
          type: string
        hostId:
          type: string

        guestSwipe:
          type: string
          enum: [left, right, none]
        guestSwipeAt:
          type: string
          format: date-time
        hostSwipe:
          type: string
          enum: [left, right, none]
        hostSwipeAt:
          type: string
          format: date-time

        guestConfirm:
          type: boolean
          nullable: true
        guestConfirmAt:
          type: string
          format: date-time
        hostConfirm:
          type: boolean
          nullable: true
        hostConfirmAt:
          type: string
          format: date-time

        guestAttending:
          type: boolean
          nullable: true
        guestAttendingAt:
          type: string
          format: date-time
        hostAttending:
          type: boolean
          nullable: true
        hostAttendingAt:
          type: string
          format: date-time

        status:
          type: string
          enum:
            - pending-swipe
            - connection-complete
            - pending-confirmation
            - confirmation-complete
            - pending-attendance
            - completed
            - rejected

        matchedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        attendingAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        rejectedBy:
          type: string
          enum: [guest, host, none]
        rejectedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string

        history:
          type: array
          items:
            type: object
            required: [phase, at, by]
            properties:
              phase:
                type: string
                enum: [swipe, confirmed, rejected, attending, completed]
              at:
                type: string
                format: date-time
              by:
                type: string
                enum: [guest, host, system]
        createdAt:
          type: string
          format: date-time

    RemoteConfigFlagsResponse:
      type: object
      description: >-
        Represents the Firebase Remote Config template structure, including
        ETag, parameters, and potentially conditions and parameter groups.
      properties:
        etag:
          type: string
          description: ETag of the template.
        parameters:
          type: object
          description: Dictionary of parameter keys to their values/definitions.
          additionalProperties:
            $ref: '#/components/schemas/FirebaseRemoteConfigParameterValue'
        conditions:
          type: array
          description: Optional list of conditions defined in the template.
          items:
            type: object
        parameterGroups:
          type: object
          description: Optional dictionary of parameter groups.
          additionalProperties:
            type: object
        version:
          type: object
          description: Optional version information.
      required:
        - etag
        - parameters
    CollectionNamesResponse:
      type: object
      description: >-
        Mapping of logical collection types to their actual Firestore collection
        names based on the environment.
      properties:
        adminChats:
          type: string
        admins:
          type: string
        appSettings:
          type: string
        messages:
          type: string
        report:
          type: string
        unfinishedRegistrationUsers:
          type: string
        userInfo:
          type: string
        events:
          type: string
        attendees:
          type: string
      required:
        - adminChats
        - admins
        - appSettings
        - messages
        - report
        - unfinishedRegistrationUsers
        - userInfo
        - events
        - attendees
      example:
        adminChats: devAdminChats
        admins: admins
        appSettings: devAppSettings
        messages: devMessages
        report: report
        unfinishedRegistrationUsers: unfinishedRegistrationUsers
        userInfo: devUserInfo
        events: devEvents
        attendees: devEventAttendees
    UserPhoneUid:
      type: object
      properties:
        uid:
          type: string
        phone:
          type: string
    FirebaseRemoteConfigParameterValue:
      type: object
      description: Represents the value of a Firebase Remote Config parameter.
      properties:
        defaultValue:
          type: object
          properties:
            value:
              type: string
            useInAppDefault:
              type: boolean
          description: Either an explicit value or instruction to use the app's default.
        conditionalValues:
          type: object
          additionalProperties:
            type: object
            properties:
              value:
                type: string
          description: Values assigned based on conditions.
        description:
          type: string
        valueType:
          type: string
          enum:
            - BOOLEAN
            - NUMBER
            - STRING
            - JSON
  securitySchemes:
    JwtAuth:
      type: apiKey
      in: header
      name: Authorization
      description: JWT token for user authentication. Use format "Bearer YOUR_JWT_TOKEN".
