openapi: 3.0.0
info:
  title: Invited Only Server API
  version: 1.0.0
  description: API for managing events, users, and configurations
servers:
  - url: http://localhost:8082/
    description: Local development server
  - url: https://api.invitedonly.app/dev/
    description: Remote development server
  - url: https://api.invitedonly.app/prod/
    description: Production server
security:
  - ApiTokenAuth: []
    FirebaseTokenAuth: []
paths:
  /auth/send-otp:
    post:
      summary: Request an OTP via Twilio Verify
      operationId: sendOtp
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: The phone number (E.164 format) to send the OTP to.
                  example: '+14155550123'
              required:
                - phone
      responses:
        '200':
          description: OTP sent successfully.
        '400':
          description: Bad request (e.g., invalid phone format).
        '500':
          description: Internal server error (e.g., Twilio API issue).
  /auth/verify-otp:
    post:
      summary: Verify an OTP and get auth tokens
      operationId: verifyOtp
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: The phone number (E.164 format) that received the OTP.
                  example: '+14155550123'
                code:
                  type: string
                  description: The OTP code entered by the user.
                  example: '123456'
              required:
                - phone
                - code
      responses:
        '200':
          description: OTP verified successfully, tokens issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: Short-lived JWT access token.
                  refreshToken:
                    type: string
                    description: Long-lived refresh token (used to get new access tokens).
                  uid:
                    type: string
                    description: The UID of the user.
                required:
                  - accessToken
                  - refreshToken
                  - uid
        '400':
          description: Bad request (e.g., missing parameters).
        '401':
          description: Unauthorized (e.g., invalid or expired OTP).
        '500':
          description: Internal server error.
  /auth/refresh:
    post:
      summary: Refresh the JWT access token using a refresh token
      operationId: refreshAccessToken
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: The phone number (E.164 format) associated with the refresh token.
                  example: '+14155550123'
                refreshToken:
                  type: string
                  description: The refresh token obtained during login/previous refresh.
              required:
                - phone
                - refreshToken
      responses:
        '200':
          description: Access token refreshed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: Newly issued short-lived JWT access token.
                  refreshToken:
                    type: string
                    description: Newly issued long-lived refresh token (rotated).
                required:
                  - accessToken
                  - refreshToken
        '400':
          description: Bad request (e.g., missing parameters).
        '403':
          description: Forbidden (e.g., invalid or expired refresh token).
        '404':
          description: User not found for the given phone number.
        '500':
          description: Internal server error.

  /events/user/{userId}:
    get:
      summary: Get events visible to a specific user
      operationId: getEventsForUser
      tags:
        - Events
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user requesting the events.
        - name: lastdoc
          in: query
          required: false
          schema:
            type: string
          description: The last document ID used for pagination.
        - name: genderfilter
          in: header
          required: false
          schema:
            type: string
            enum:
              - male
              - female
          description: Filter events based on the host's gender.
        - name: limit
          in: header
          required: false
          schema:
            type: integer
            default: 7
          description: Maximum number of events to return.
      responses:
        '200':
          description: A list of events and pagination info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          description: Bad request (e.g., invalid parameters).
        '500':
          description: Internal server error.
  /events/host/{hostId}:
    get:
      summary: Get events hosted by a specific user
      operationId: getHostEvents
      tags:
        - Events
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
          description: The UID of the host.
      responses:
        '200':
          description: List of events hosted by the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventData'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /events:
    post:
      summary: Create a new event
      operationId: createEvent
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventData'
      responses:
        '201':
          description: Event created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventData'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /events/{eventId}:
    patch:
      summary: Update an existing event
      operationId: updateEvent
      tags:
        - Events
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventData'
      responses:
        '200':
          description: Event updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventData'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    delete:
      summary: Delete an event
      operationId: deleteEvent
      tags:
        - Events
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event to delete.
      responses:
        '200':
          description: Event deleted successfully.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /users/event/{eventId}:
    get:
      summary: Get users for an event (alternative endpoint)
      operationId: getUsersForEvent_alt
      tags:
        - Users
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event to update.
        - name: excludeuids
          in: header
          required: false
          schema:
            type: string
            description: JSON string array of UIDs to exclude.
        - name: lastdoc
          in: query
          required: false
          schema:
            type: string
        - name: male
          in: header
          required: false
          schema:
            type: integer
            default: 0
        - name: female
          in: header
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: header
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /users:
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'

      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /users/{id}:
    delete:
      summary: Delete a user account
      operationId: deleteUserAccount
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user to delete.
      responses:
        '200':
          description: Confirmation of deletion.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    patch:
      summary: Update a user account
      operationId: updateUserAccount
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    get:
      summary: Get a user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user to get.
      responses:
        '200':
          description: User found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/phone/{phone}:
    get:
      summary: Get a user by phone number
      operationId: getUserByPhone
      tags:
        - Users
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /users/{id}/fcmToken:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The UID of the user.
    post:
      summary: Add FCM token for a user
      operationId: addFcmTokenToUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcm_token
              properties:
                fcm_token:
                  type: string
                  description: Firebase Cloud Messaging token
      responses:
        '200':
          description: FCM token saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: FCM token saved successfully
        '400':
          description: Invalid FCM token
        '500':
          description: Internal server error

  /eventAttendees/create:
    post:
      summary: Create an event attendance record
      operationId: createEventAttend
      tags:
        - Event Attendees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guestId:
                  type: string
                hostId:
                  type: string
                eventId:
                  type: string
                guest_swipe:
                  type: string
                  enum:
                    - left
                    - right
                    - none
                  nullable: true
                host_swipe:
                  type: string
                  enum:
                    - left
                    - right
                    - none
                  nullable: true
                guest_swipe_at:
                  type: string
                  format: date-time
                  nullable: true
                host_swipe_at:
                  type: string
                  format: date-time
              required:
                - guestId
                - hostId
                - eventId
      responses:
        '200':
          description: Event attendance created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionRequest'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.

  /eventAttendees/host-request:
    get:
      summary: Get pending join requests for host
      operationId: getPendingGuests
      tags:
        - Event Attendees
      parameters:
        - name: host_id
          in: query
          required: true
          description: The UID of the host
          schema:
            type: string
        - name: event_id
          in: query
          required: true
          description: The ID of the event
          schema:
            type: string
      responses:
        '200':
          description: Guest invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas'
        '400':
          description: Bad request
        '500':
          description: Internal server error.
  /eventAttendees/guest-invitation:
    get:
      summary: Get event invitations for guest
      operationId: getEventInvitation
      tags:
        - Event Attendees
      parameters:
        - name: guest_id
          in: query
          required: true
          description: The UID of the host
          schema:
            type: string

      responses:
        '200':
          description: Event invitations for guest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas'
        '400':
          description: Bad request
        '500':
          description: Internal server error.
  /eventAttendees/guest/{guestId}:
    get:
      summary: Get event attendance records for a guest
      operationId: getGuestEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: guestId
          in: path
          required: true
          schema:
            type: string
          description: The UID of the guest.
      responses:
        '200':
          description: List of event attendance records for the guest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionRequest'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /eventAttendees/host/{hostId}:
    get:
      summary: Get event attendance records for events hosted by a user
      operationId: getHostEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of event attendance records for the host's events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionRequest'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /eventAttendees/{id}:
    patch:
      summary: Update an event attendance record
      operationId: updateEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event attendance record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
      responses:
        '200':
          description: Event attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionRequest'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    delete:
      summary: Delete an event attendance record
      operationId: deleteEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event attendance record to delete.
      responses:
        '200':
          description: Confirmation of deletion.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /config/flags:
    get:
      summary: Get remote configuration flags
      operationId: getRemoteConfigFlags
      tags:
        - Config
      responses:
        '200':
          description: Remote config flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfigFlagsResponse'
        '500':
          description: Internal server error.
  /config/firebase/collections:
    get:
      summary: Get Firebase collection names for the current environment
      operationId: getFirebaseCollectionNames
      tags:
        - Config
      responses:
        '200':
          description: Collection names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionNamesResponse'
        '500':
          description: Internal server error.

  /chat:
    summary: chats related api
    post:
      summary: Create a new chat
      operationId: createChat
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
      responses:
        '200':
          description: Chat created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/user/{userId}:
    get:
      summary: Get chats for a user
      operationId: getChatsForUser
      tags:
        - Chat
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of chats for the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/event/{eventId}:
    get:
      summary: Get chats for an event
      operationId: getChatsForEvent
      tags:
        - Chat
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of chats for the event.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/message/{chatId}:
    post:
      summary: Create a new message
      operationId: createMessage
      tags:
        - Chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
      responses:
        '200':
          description: Message created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    get:
      summary: Get messages by chat id
      operationId: getMessages
      tags:
        - Chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message created successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/{chatId}/seen:
    patch:
      summary: Mark chat as seen by user
      operationId: markChatAsSeen
      tags:
        - Chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the chat to mark as seen.
      requestBody:
        required: true
        description: The user ID marking the chat as seen.
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The UID of the user who has seen the chat.
              required:
                - userId
      responses:
        '204':
          description: Successfully marked as seen (No Content).
        '400':
          description: Bad request (e.g., missing userId in body or invalid chatId/userId format).
        '404':
          description: Chat not found.
        '500':
          description: Internal server error.



  /report/user/{userId}:
    get:
      summary: Get reports by user ID
      description: Returns a list of reports associated with the specified user ID.
      operationId: getReportsByUserId
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: string
      responses:
        '200':
          description: A list of reports for the given user ID
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    nameSender:
                      type: string
                    phone:
                      type: string
                    phoneSender:
                      type: string
                    photo:
                      type: string
                      format: uri
                    photoSender:
                      type: string
                      format: uri
                    typeReport:
                      type: string
                    uid:
                      type: string
                    uidSender:
                      type: string
        '400':
          description: Invalid user ID
        '500':
          description: Internal server error
  /report/create:
    post:
      summary: Create a new report
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nameSender:
                  type: string
                phone:
                  type: string
                phoneSender:
                  type: string
                photo:
                  type: string
                  format: uri
                photoSender:
                  type: string
                  format: uri
                typeReport:
                  type: string
                uid:
                  type: string
                uidSender:
                  type: string

      responses:
        '200':
          description: Report created successfully
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /report/{id}:
    get:
      summary: Get a report by ID (via query parameter)
      description: Fetches a single report based on the provided `id` query parameter.
      operationId: getReport
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the report
          schema:
            type: string
      responses:
        '200':
          description: Report object returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  nameSender:
                    type: string
                  phone:
                    type: string
                  phoneSender:
                    type: string
                  photo:
                    type: string
                    format: uri
                  photoSender:
                    type: string
                    format: uri
                  typeReport:
                    type: string
                  uid:
                    type: string
                  uidSender:
                    type: string
        '400':
          description: Missing or invalid ID
        '500':
          description: Internal server error
    patch:
      summary: Update a report by ID
      operationId: updateReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial update for ReportModel
              properties:
                name:
                  type: string
                nameSender:
                  type: string
                phone:
                  type: string
                phoneSender:
                  type: string
                photo:
                  type: string
                  format: uri
                photoSender:
                  type: string
                  format: uri
                typeReport:
                  type: string
                uid:
                  type: string
                uidSender:
                  type: string
      responses:
        '200':
          description: Report updated successfully
        '400':
          description: Invalid record ID
        '500':
          description: Internal server error

    delete:
      summary: Delete a report by ID
      operationId: deleteReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report deleted successfully or not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid report ID
        '500':
          description: Internal server error
components:
  schemas:
    User:
      type: object
      properties:
        notificationSettings:
          $ref: '#/components/schemas/UserNotificationSettings'
        location:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        birthday:
          type: string
          format: date-time
        gender:
          type: string
          enum:
            - man
            - woman
            - other
        facePhoto:
          type: string
        activeSubscription:
          $ref: '#/components/schemas/ActiveSubscription'
        phoneNumber:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/UserPhoto'
        notifications:
          type: array
          items: {}
