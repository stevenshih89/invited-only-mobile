openapi: 3.0.0
info:
  title: Invited Only Server API
  version: 1.0.0
  description: API for managing events, users, and configurations
servers:
  - url: http://localhost:8082/
    description: Local development server
  - url: https://api.invitedonly.app/dev/
    description: Remote development server
  - url: https://api.invitedonly.app/prod/
    description: Production server
security:
  - ApiTokenAuth: []
    FirebaseTokenAuth: []
paths:
  /events/user/{userId}:
    get:
      summary: Get events visible to a specific user
      operationId: getEventsForUser
      tags:
        - Events
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user requesting the events.
        - name: lastdoc
          in: query
          required: false
          schema:
            type: string
          description: The last document ID used for pagination.
        - name: genderfilter
          in: header
          required: false
          schema:
            type: string
            enum:
              - male
              - female
          description: Filter events based on the host's gender.
        - name: limit
          in: header
          required: false
          schema:
            type: integer
            default: 7
          description: Maximum number of events to return.
      responses:
        '200':
          description: A list of events and pagination info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          description: Bad request (e.g., invalid parameters).
        '500':
          description: Internal server error.
  /events/host/{hostId}:
    get:
      summary: Get events hosted by a specific user
      operationId: getHostEvents
      tags:
        - Events
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
          description: The UID of the host.
      responses:
        '200':
          description: List of events hosted by the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventData'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /events:
    post:
      summary: Create a new event
      operationId: createEvent
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventData'
      responses:
        '201':
          description: Event created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventData'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /events/{eventId}:
    patch:
      summary: Update an existing event
      operationId: updateEvent
      tags:
        - Events
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventData'
      responses:
        '200':
          description: Event updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventData'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    delete:
      summary: Delete an event
      operationId: deleteEvent
      tags:
        - Events
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event to delete.
      responses:
        '200':
          description: Event deleted successfully.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /users/event/{eventId}:
    get:
      summary: Get users for an event (alternative endpoint)
      operationId: getUsersForEvent_alt
      tags:
        - Users
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event to update.
        - name: excludeuids
          in: header
          required: false
          schema:
            type: string
            description: JSON string array of UIDs to exclude.
        - name: lastdoc
          in: query
          required: false
          schema:
            type: string
        - name: male
          in: header
          required: false
          schema:
            type: integer
            default: 0
        - name: female
          in: header
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: header
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /users:
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /users/{id}:
    delete:
      summary: Delete a user account
      operationId: deleteUserAccount
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user to delete.
      responses:
        '200':
          description: Confirmation of deletion.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    patch:
      summary: Update a user account
      operationId: updateUserAccount
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    get:
      summary: Get a user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UID of the user to get.
      responses:
        '200':
          description: User found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /eventAttendees/create:
    post:
      summary: Create an event attendance record
      operationId: createEventAttend
      tags:
        - Event Attendees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guestId:
                  type: string
                hostId:
                  type: string
                eventId:
                  type: string
                guest_swipe:
                  type: string
                  enum:
                    - left
                    - right
                    - none
                  nullable: true
                host_swipe:
                  type: string
                  enum:
                    - left
                    - right
                    - none
                  nullable: true
                guest_swipe_at:
                  type: string
                  format: date-time
                  nullable: true
                host_swipe_at:
                  type: string
                  format: date-time
              required:
                - guestId
                - hostId
                - eventId
      responses:
        '200':
          description: Event attendance created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConfirmation'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.

  /eventAttendees/host-request:
    get:
      summary: Get pending join requests for host
      operationId: getPendingGuests
      tags:
        - Event Attendees
      parameters:
        - name: host_id
          in: query
          required: true
          description: The UID of the host
          schema:
            type: string
        - name: event_id
          in: query
          required: true
          description: The ID of the event
          schema:
            type: string
      responses:
        '200':
          description: Guest invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas'
        '400':
          description: Bad request
        '500':
          description: Internal server error.
  /eventAttendees/guest-invitation:
    get:
      summary: Get event invitations for guest
      operationId: getEventInvitation
      tags:
        - Event Attendees
      parameters:
        - name: guest_id
          in: query
          required: true
          description: The UID of the host
          schema:
            type: string

      responses:
        '200':
          description: Event invitations for guest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas'
        '400':
          description: Bad request
        '500':
          description: Internal server error.
  /eventAttendees/guest/{guestId}:
    get:
      summary: Get event attendance records for a guest
      operationId: getGuestEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: guestId
          in: path
          required: true
          schema:
            type: string
          description: The UID of the guest.
      responses:
        '200':
          description: List of event attendance records for the guest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventConfirmation'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /eventAttendees/host/{hostId}:
    get:
      summary: Get event attendance records for events hosted by a user
      operationId: getHostEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of event attendance records for the host's events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventConfirmation'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /eventAttendees/{id}:
    patch:
      summary: Update an event attendance record
      operationId: updateEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event attendance record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventConfirmation'
      responses:
        '200':
          description: Event attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConfirmation'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    delete:
      summary: Delete an event attendance record
      operationId: deleteEventAttend
      tags:
        - Event Attendees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the event attendance record to delete.
      responses:
        '200':
          description: Confirmation of deletion.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /config/flags:
    get:
      summary: Get remote configuration flags
      operationId: getRemoteConfigFlags
      tags:
        - Config
      responses:
        '200':
          description: Remote config flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfigFlagsResponse'
        '500':
          description: Internal server error.
  /config/firebase/collections:
    get:
      summary: Get Firebase collection names for the current environment
      operationId: getFirebaseCollectionNames
      tags:
        - Config
      responses:
        '200':
          description: Collection names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionNamesResponse'
        '500':
          description: Internal server error.

  /chat:
    summary: chats related api
    post:
      summary: Create a new chat
      operationId: createChat
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
      responses:
        '200':
          description: Chat created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/user/{userId}:
    get:
      summary: Get chats for a user
      operationId: getChatsForUser
      tags:
        - Chat
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of chats for the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/event/{eventId}:
    get:
      summary: Get chats for an event
      operationId: getChatsForEvent
      tags:
        - Chat
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of chats for the event.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/message/{chatId}:
    post:
      summary: Create a new message
      operationId: createMessage
      tags:
        - Chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
      responses:
        '200':
          description: Message created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
    get:
      summary: Get messages by chat id
      operationId: getMessages
      tags:
        - Chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message created successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.
  /chat/{chatId}/seen:
    patch:
      summary: Mark chat as seen by user
      operationId: markChatAsSeen
      tags:
        - Chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the chat to mark as seen.
      requestBody:
        required: true
        description: The user ID marking the chat as seen.
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The UID of the user who has seen the chat.
              required:
                - userId
      responses:
        '204':
          description: Successfully marked as seen (No Content).
        '400':
          description: Bad request (e.g., missing userId in body or invalid chatId/userId format).
        '404':
          description: Chat not found.
        '500':
          description: Internal server error.
components:
  schemas:
    User:
      type: object
      properties:
        notificationSettings:
          $ref: '#/components/schemas/UserNotificationSettings'
        location:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        age:
          type: number
          nullable: true
        gender:
          type: string
          enum:
            - man
            - woman
            - other
        facePhoto:
          type: string
        activeSubscription:
          $ref: '#/components/schemas/ActiveSubscription'
        phoneNumber:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/UserPhoto'
        notifications:
          type: array
          items: {}
          description: Structure unknown, defined as array of any.
        name:
          type: string
        showAge:
          type: boolean
        lastUpdateSuperInvite:
          type: number
          format: timestamp
        accountReviewed:
          type: boolean
        socialNickname:
          $ref: '#/components/schemas/SocialNickname'
        weeklySuperInvites:
          type: integer
        fcmToken:
          type: string
        createdAt:
          type: string
          format: date-time
        accountType:
          type: string
          enum:
            - guest
            - user
            - admin
        email:
          type: string
          format: email
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        accountPremium:
          type: boolean
        chooseGuest:
          type: string
        userBeauty:
          type: number
        interests:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
        showLocation:
          type: boolean
        online:
          type: boolean
        date:
          type: string
          format: date-time
        superInvites:
          type: integer
        superInvite:
          type: boolean
        uid:
          type: string
        registrationDate:
          type: string
          format: date-time
        codeForInvitingOtherUsers:
          type: array
          items:
            $ref: '#/components/schemas/InviteCode'
        accountConfirmed:
          type: boolean
        homeAddress:
          type: string
          nullable: true
        work:
          $ref: '#/components/schemas/Work'
      required:
        - uid
        - name
        - gender
    UserNotificationSettings:
      type: object
      properties:
        chat:
          type: boolean
        match:
          type: boolean
        myEvents:
          type: boolean
        superInvite:
          type: boolean
        superJoin:
          type: boolean
        joinedEvent:
          type: boolean
        requests:
          type: boolean
    UserPhoto:
      type: object
      properties:
        id:
          type: integer
        image:
          type: string
          nullable: true
    EventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventData'
        lastDoc:
          type: string
          nullable: true
        endReached:
          type: boolean
    Chat:
      type: object
      properties:
        id:
          type: string
          nullable: true
        guestId:
          type: string
        hostId:
          type: string
        eventId:
          type: string
        hostImageUrl:
          type: string
        guestImageUrl:
          type: string
        guestName:
          type: string
        hostName:
          type: string
        lastMessage:
          type: string
        lastMessageTimestamp:
          type: string
          format: date-time
        unreadMessages:
          type: integer
        userLastSeen:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              lastSeen:
                type: string
                format: date-time
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
          nullable: false
        content:
          type: string
        senderId:
          type: string
        timestamp:
          type: string
          format: datetime
    EventData:
      type: object
      properties:
        uid:
          type: string
          nullable: false
        showModalAccept:
          type: boolean
        hostId:
          type: string
          nullable: false
        name:
          type: string
          nullable: false
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        meetingSpot:
          type: string
        placeName:
          type: string
        location:
          type: string
        male:
          type: number
        female:
          type: number
        maleFriend:
          type: number
        femaleFriend:
          type: number
        hostImage:
          type: string
        hostName:
          type: string
        date:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        eventReviewed:
          type: boolean
        hour:
          type: string
        eventsListVisit:
          type: array
          items:
            type: string
        requestsList:
          type: array
          items:
            $ref: '#/components/schemas/UserRequest'
        usersList:
          type: array
          items:
            $ref: '#/components/schemas/EventUser'
        rejectsByGuestsList:
          type: array
          items:
            $ref: '#/components/schemas/EventUser'
        isCancelled:
          type: boolean
          nullable: true
        statusEvent:
          type: boolean
          nullable: true
      required:
        - uid
    InviteCode:
      type: object
      properties:
        inviteCode:
          type: string
        isActive:
          type: boolean
    NotificationSettings:
      type: object
      properties:
        chat:
          type: boolean
        joinedEvent:
          type: boolean
        match:
          type: boolean
        myEvents:
          type: boolean
        requests:
          type: boolean
        superInvite:
          type: boolean
        superJoin:
          type: boolean
    SocialNickname:
      type: object
      properties:
        instagram:
          type: string
        tiktok:
          type: string
    ActiveSubscription:
      type: object
      properties:
        expirationDate:
          type: string
          format: date-time
        subscriptionId:
          type: string
    Language:
      type: object
      properties:
        flag:
          type: string
        id:
          type: string
        title:
          type: string
    Photo:
      type: object
      properties:
        id:
          type: integer
        image:
          type: string
    Work:
      type: object
      properties:
        description:
          type: string
        title:
          type: string
    Interest:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
      required:
        - id
    UserRequest:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        gender:
          type: string
        name:
          type: string
        status:
          type: string
        superInvite:
          type: boolean
        uid:
          type: string
        userPhoto:
          type: string
    EventUser:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        gender:
          type: string
        name:
          type: string
        status:
          type: string
        superInvite:
          type: boolean
        uid:
          type: string
        userPhoto:
          type: string
    EventConfirmation:
      type: object
      properties:
        event_id:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
        host_id:
          type: string
        guest_swipe:
          type: string
          enum:
            - left
            - right
            - none
          nullable: true
          default: none
        guest_swipe_at:
          type: string
          format: date-time
          nullable: true
        guest_confirm:
          nullable: true
          type: boolean
        guest_confirm_at:
          type: string
          format: date-time
          nullable: true
        guest_reject:
          type: boolean
          nullable: true
        guest_reject_at:
          type: string
          format: date-time
          nullable: true
        host_swipe:
          type: string
          enum:
            - left
            - right
            - none
          nullable: true
          default: none
        host_swipe_at:
          type: string
          format: date-time
          nullable: true
        host_confirm:
          type: boolean
          nullable: true
        host_confirm_at:
          type: string
          format: date-time
          nullable: true
        host_reject:
          type: boolean
          nullable: true
        host_reject_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - pending-host
            - pending-guest
            - host-reject
            - guest-reject
            - invitation-complete
          nullable: true
    ConnectionRequest:
      type: object
      required:
        - connectionId
        - eventId
        - guestId
        - hostId
        - guestSwipe
        - hostSwipe
        - status
        - createdAt
      properties:
        connectionId:
          type: string
          description: Unique identifier, e.g. `${eventId}_${guestId}`
        eventId:
          type: string
        guestId:
          type: string
        hostId:
          type: string

        guestSwipe:
          type: string
          enum: [left, right, none]
        guestSwipeAt:
          type: string
          format: date-time
        hostSwipe:
          type: string
          enum: [left, right, none]
        hostSwipeAt:
          type: string
          format: date-time

        guestConfirm:
          type: boolean
          nullable: true
        guestConfirmAt:
          type: string
          format: date-time
        hostConfirm:
          type: boolean
          nullable: true
        hostConfirmAt:
          type: string
          format: date-time

        guestAttending:
          type: boolean
          nullable: true
        guestAttendingAt:
          type: string
          format: date-time
        hostAttending:
          type: boolean
          nullable: true
        hostAttendingAt:
          type: string
          format: date-time

        status:
          type: string
          enum:
            - pending-swipe
            - pending-confirmation
            - rejected
            - confirmed
            - pending-attendance
            - attending
            - completed

        matchedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        attendingAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

        rejectedBy:
          type: string
          enum: [guest, host]
        rejectedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string

        history:
          type: array
          items:
            type: object
            required: [phase, at, by]
            properties:
              phase:
                type: string
                enum: [swipe, confirmed, rejected, attending, completed]
              at:
                type: string
                format: date-time
              by:
                type: string
                enum: [guest, host, system]
        createdAt:
          type: string
          format: date-time

    RemoteConfigFlagsResponse:
      type: object
      description: >-
        Represents the Firebase Remote Config template structure, including
        ETag, parameters, and potentially conditions and parameter groups.
      properties:
        etag:
          type: string
          description: ETag of the template.
        parameters:
          type: object
          description: Dictionary of parameter keys to their values/definitions.
          additionalProperties:
            $ref: '#/components/schemas/FirebaseRemoteConfigParameterValue'
        conditions:
          type: array
          description: Optional list of conditions defined in the template.
          items:
            type: object
        parameterGroups:
          type: object
          description: Optional dictionary of parameter groups.
          additionalProperties:
            type: object
        version:
          type: object
          description: Optional version information.
      required:
        - etag
        - parameters
    CollectionNamesResponse:
      type: object
      description: >-
        Mapping of logical collection types to their actual Firestore collection
        names based on the environment.
      properties:
        adminChats:
          type: string
        admins:
          type: string
        appSettings:
          type: string
        messages:
          type: string
        report:
          type: string
        unfinishedRegistrationUsers:
          type: string
        userInfo:
          type: string
        events:
          type: string
        attendees:
          type: string
      required:
        - adminChats
        - admins
        - appSettings
        - messages
        - report
        - unfinishedRegistrationUsers
        - userInfo
        - events
        - attendees
      example:
        adminChats: devAdminChats
        admins: admins
        appSettings: devAppSettings
        messages: devMessages
        report: report
        unfinishedRegistrationUsers: unfinishedRegistrationUsers
        userInfo: devUserInfo
        events: devEvents
        attendees: devEventAttendees
    FirebaseRemoteConfigParameterValue:
      type: object
      description: Represents the value of a Firebase Remote Config parameter.
      properties:
        defaultValue:
          type: object
          properties:
            value:
              type: string
            useInAppDefault:
              type: boolean
          description: Either an explicit value or instruction to use the app's default.
        conditionalValues:
          type: object
          additionalProperties:
            type: object
            properties:
              value:
                type: string
          description: Values assigned based on conditions.
        description:
          type: string
        valueType:
          type: string
          enum:
            - BOOLEAN
            - NUMBER
            - STRING
            - JSON
  securitySchemes:
    ApiTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Static API Key for service access. Use format "Bearer YOUR_API_TOKEN".
    FirebaseTokenAuth:
      type: apiKey
      in: header
      name: token
      description: >-
        Firebase ID token for user authentication (required when Firebase
        validation is enabled server-side).
